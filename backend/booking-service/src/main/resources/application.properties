# Application Configuration
spring.application.name=booking-service
server.port=8080

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Database Configuration - Using common database configurations from common-security module
# Database URLs/credentials for ECOM, documentation, and report sources are provided via
# shared configuration (e.g. api-gateway / env); this module uses the corresponding JPA and
# JdbcTemplate beans from common-security where configured.

# Logging Configuration
logging.level.com.solverminds.booking=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.security=WARN

# Security Configuration
# JWT configuration would be handled by common-security library

# Spring Boot 2.x specific configurations
spring.main.allow-bean-definition-overriding=true

# Jackson Configuration - Ensure dates are formatted as strings, not timestamps
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# OpenAPI 3.0 Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.show-actuator=false
springdoc.packages-to-scan=com.solverminds.booking

# File Upload Configuration - Support up to 10MB per file, max 50MB total request size, up to 5 files per request
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.resolve-lazily=false