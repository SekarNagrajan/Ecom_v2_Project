# Application Configuration
spring.application.name=sibl-service
server.port=8080

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Database Configuration - Using common database configurations from common-security module
# No local database configuration needed - uses reportJdbcTemplate and documentationJdbcTemplate beans

# Logging Configuration
logging.level.com.solverminds.sibl=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.security=WARN

# Security Configuration
# JWT configuration would be handled by common-security library

# Spring Boot 2.x specific configurations
spring.main.allow-bean-definition-overriding=true

# Jackson Configuration - Ensure dates are formatted as strings, not timestamps
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# OpenAPI 3.0 Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.show-actuator=false
springdoc.packages-to-scan=com.solverminds.sibl
