# SpringDoc OpenAPI 3.0 Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
# IMPORTANT: Do NOT set "urls:" when you want a single page
# springdoc.swagger-ui.url=/v3/api-docs   # optional; only if you overrode defaults
springdoc.cache.disabled=true

# Enhanced schema discovery settings
springdoc.show-actuator=false
springdoc.auto-tag-classes=true
springdoc.remove-broken-reference-definitions=false
springdoc.default-consumes-media-type=application/json
springdoc.default-produces-media-type=application/json

# Ensure all schemas are discovered and processed
springdoc.override-with-generic-response=false
springdoc.model-and-view-allowed=true